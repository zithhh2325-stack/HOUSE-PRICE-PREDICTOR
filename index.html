<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>House Price Predictor</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: Arial, sans-serif;
        }

        body{
            background: linear-gradient(135deg, #667eea, #764ba2);
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
        }

        .container{
            background:white;
            padding:30px;
            width:450px;
            border-radius:20px;
            box-shadow:0 10px 30px rgba(0,0,0,0.2);
            text-align:center;
        }

        h2{
            color:#4a4a4a;
            margin-bottom:20px;
        }

        input{
            width:100%;
            padding:12px;
            margin:8px 0;
            border:2px solid #ddd;
            border-radius:10px;
            font-size:15px;
            transition:0.3s;
        }

        input:focus{
            border-color:#667eea;
            outline:none;
            box-shadow:0 0 10px rgba(102,126,234,0.4);
        }

        button{
            width:100%;
            padding:12px;
            margin-top:15px;
            border:none;
            border-radius:10px;
            background:linear-gradient(135deg,#ff6a00,#ee0979);
            color:white;
            font-size:18px;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            transform:scale(1.05);
        }

        .result{
            margin-top:20px;
            font-size:20px;
            color:#28a745;
            font-weight:bold;
        }
    </style>
</head>

<body>

<div class="container">
    <h2>🏠 House Price Prediction</h2>

    <form action="/predict" method="post">

        <input type="number" name="OverallQual"
               placeholder="⭐ Overall Quality (1-10)" required>

        <input type="number" name="GrLivArea"
               placeholder="📏 Living Area (sqft)" required>

        <input type="number" name="GarageCars"
               placeholder="🚗 Garage Capacity" required>

        <input type="number" name="TotalBsmtSF"
               placeholder="🏗 Basement Area (sqft)" required>

        <input type="number" name="YearBuilt"
               placeholder="📅 Year Built" required>

        <input type="number" name="FullBath"
               placeholder="🛁 Full Bathrooms" required>

        <input type="number" name="BedroomAbvGr"
               placeholder="🛏 Bedrooms" required>

        <input type="number" name="LotArea"
               placeholder="🌳 Plot Area" required>

        <button type="submit">🔮 Predict Price</button>

    </form>

    <div class="result">
        {{ prediction_text }}
    </div>

</div>

</body>
</html>
